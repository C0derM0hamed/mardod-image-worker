name: Build and publish image worker

# Builds entirely on GitHub's runners and pushes to GHCR, so nothing large is ever uploaded from a
# developer machine. RunPod then pulls the published image directly.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mardod-image-worker:1.0.0
            ghcr.io/${{ github.repository_owner }}/mardod-image-worker:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
